
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .contenedor {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px #00000012;
        }

        .formulario {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        .botones {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.85;
        }

        .agregar {
            background: #2563eb;
        }

        .actualizar {
            background: #d97706;
        }

        .cancelar {
            background: #64748b;
        }

        .eliminar {
            background: #dc2626;
        }

        .buscar {
            background: #0f766e;
        }

        .mostrar {
            background: #475569;
        }

        .busqueda {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tabla-contenedor {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th, td {
            padding: 13px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #1e3a8a;
            color: white;
        }

        tr:hover {
            background: #f8fafc;
        }

        .editar {
            background: #d97706;
            margin-right: 5px;
        }

        .eliminar-fila {
            background: #dc2626;
        }

        .mensaje {
            margin-top: 15px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .formulario {
                grid-template-columns: 1fr;
            }

            .busqueda {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>Sistema de Inventario</h1>

    <div class="panel">

        <h2>Registro de productos</h2>

        <form id="formulario">

            <div class="formulario">

                <input type="text" id="codigo"
                    placeholder="Código del producto" required>

                <input type="text" id="nombre"
                    placeholder="Nombre del producto" required>

                <input type="number" id="precio"
                    placeholder="Precio" min="0" step="0.01" required>

                <input type="number" id="existencia"
                    placeholder="Cantidad en existencia" min="0"
                    step="1" required>

            </div>

            <div class="botones">

                <button type="submit" class="agregar" id="btnAgregar">
                    Agregar producto
                </button>

                <button type="button" class="actualizar"
                    id="btnActualizar" hidden>
                    Guardar cambios
                </button>

                <button type="button" class="cancelar"
                    id="btnCancelar" hidden>
                    Cancelar
                </button>

                <button type="reset" class="mostrar">
                    Limpiar campos
                </button>

            </div>

        </form>

        <p class="mensaje" id="mensaje"></p>

    </div>


    <div class="panel">

        <h2>Inventario de productos</h2>

        <div class="busqueda">

            <input type="text" id="buscar"
                placeholder="Buscar por código o nombre">

            <button class="buscar" id="btnBuscar">
                Buscar
            </button>

            <button class="mostrar" id="btnMostrar">
                Mostrar todos
            </button>

        </div>

        <div class="tabla-contenedor">

            <table>

                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Existencia</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="tablaProductos"></tbody>

            </table>

        </div>

    </div>

</div>

<script src="Producto.js"></script>
<script src="BusquedaProducto.js"></script>
<script src="app.js"></script>

</body>
</html>
