
name: Despliegue del sistema de inventario

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar archivos del proyecto
        run: |
          test -f src/Producto.js
          test -f src/BusquedaProducto.js
          test -f src/app.js
          test -f src/index.html

      - name: Verificar sintaxis JavaScript
        run: |
          node --check src/Producto.js
          node --check src/BusquedaProducto.js
          node --check src/app.js

      - name: Preparar paquete de despliegue
        run: |
          mkdir -p release
          cp src/Producto.js release/
          cp src/BusquedaProducto.js release/
          cp src/app.js release/
          cp src/index.html release/

      - name: Generar paquete
        run: |
          cd release
          zip -r ../sistema-inventario.zip .

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sistema-inventario
          path: sistema-inventario.zip
